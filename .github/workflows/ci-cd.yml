name: CI & Appwrite Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'codecov.yml'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'codecov.yml'
      - '.gitignore'
      - '.env.example'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        default: all
        options:
          - all
          - site
          - functions
      activate:
        description: Activate deployments once built
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node scripts/package-diary-bundle.mjs
          mkdir -p coverage
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='server/**/*.mjs' \
            --test-coverage-exclude='server/domain/nutrient-*-data.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            tests/*.test.mjs

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build Astro SSR bundle
        run: npm run build

  deploy:
    name: Deploy to Appwrite
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Site & Functions
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ vars.APPWRITE_SITE_ID }}
          APPWRITE_REMINDERS_FUNCTION_ID: ${{ vars.APPWRITE_REMINDERS_FUNCTION_ID }}
          APPWRITE_SCHEDULER_FUNCTION_ID: ${{ vars.APPWRITE_SCHEDULER_FUNCTION_ID }}
          APPWRITE_CLEANUP_FUNCTION_ID: ${{ vars.APPWRITE_CLEANUP_FUNCTION_ID }}
        run: |
          TARGET="${{ inputs.target || 'all' }}"
          ACTIVATE="${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.activate) || 'true' }}"
          node scripts/deploy-appwrite.mjs --target="$TARGET" --activate="$ACTIVATE"
